<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DDTank · Calculadora de Tiro</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #1a0b2e;
            --surface: #2d1b4e;
            --surface-hover: #3d2a63;
            --border: #4a3a6a;
            --text: #f0e6ff;
            --text-muted: #b8a8d9;
            --accent: #ff6b9d;
            --accent-hover: #ff4d7d;
            --yellow: #ffd93d;
            --blue: #4dabf7;
            --green: #51cf66;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #1a0b2e 0%, #2d1b4e 50%, #1a0b2e 100%);
            background-attachment: fixed;
            color: var(--text);
            font-family: 'Fredoka', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            -webkit-font-smoothing: antialiased;
        }

        .container {
            width: 100%;
            max-width: 520px;
        }

        .header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .logo {
            font-size: 2.5rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            margin-bottom: 0.25rem;
            background: linear-gradient(135deg, var(--accent), var(--yellow));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 0 30px rgba(255, 107, 157, 0.3);
        }

        .subtitle {
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        .card {
            background: var(--surface);
            border: 2px solid var(--border);
            border-radius: 24px;
            padding: 2rem;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.05);
        }

        .field {
            margin-bottom: 1.5rem;
        }

        label {
            display: block;
            font-size: 0.9rem;
            font-weight: 500;
            color: var(--text-muted);
            margin-bottom: 0.6rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
        }

        input, select {
            width: 100%;
            background: var(--bg);
            border: 2px solid var(--border);
            border-radius: 14px;
            padding: 1rem 1.2rem;
            color: var(--text);
            font-size: 1.1rem;
            font-family: 'Fredoka', sans-serif;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
            outline: none;
        }

        input:focus, select:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 4px rgba(255, 107, 157, 0.15);
        }

        select {
            cursor: pointer;
        }

        button.calculate {
            width: 100%;
            background: linear-gradient(135deg, var(--accent), #d6336c);
            color: #fff;
            border: none;
            border-radius: 14px;
            padding: 1.1rem;
            font-size: 1.1rem;
            font-weight: 600;
            font-family: 'Fredoka', sans-serif;
            cursor: pointer;
            transition: transform 0.15s ease, box-shadow 0.2s ease;
            box-shadow: 0 8px 25px rgba(255, 107, 157, 0.35);
            margin-top: 0.5rem;
        }

        button.calculate:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 35px rgba(255, 107, 157, 0.5);
        }

        button.calculate:active {
            transform: translateY(0) scale(0.98);
        }

        .result {
            margin-top: 2rem;
            padding-top: 2rem;
            border-top: 2px dashed var(--border);
            display: none;
        }

        .result.active {
            display: block;
            animation: popIn 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        @keyframes popIn {
            from { opacity: 0; transform: scale(0.95) translateY(10px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }

        .result-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.85rem 0;
            font-size: 0.95rem;
            border-bottom: 1px solid rgba(74, 58, 106, 0.5);
        }

        .result-row:last-child {
            border-bottom: none;
        }

        .result-row .label {
            color: var(--text-muted);
        }

        .result-row .value {
            font-weight: 600;
            font-family: 'JetBrains Mono', monospace;
        }

        .result-highlight {
            background: linear-gradient(135deg, rgba(255, 107, 157, 0.15), rgba(255, 217, 61, 0.1));
            border: 2px solid var(--accent);
            border-radius: 16px;
            padding: 1.5rem;
            margin-top: 1rem;
            text-align: center;
        }

        .result-highlight .label {
            font-size: 0.85rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.1em;
            margin-bottom: 0.5rem;
        }

        .result-highlight .value {
            font-size: 2.5rem;
            font-weight: 700;
            font-family: 'JetBrains Mono', monospace;
            color: var(--yellow);
            text-shadow: 0 0 20px rgba(255, 217, 61, 0.5);
        }

        .wind-indicator {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            font-weight: 600;
        }

        .wind-arrow {
            font-size: 1.2rem;
        }

        .note {
            margin-top: 1.5rem;
            padding: 1rem 1.2rem;
            background: rgba(77, 171, 247, 0.08);
            border: 1px solid rgba(77, 171, 247, 0.25);
            border-radius: 12px;
            font-size: 0.8rem;
            color: var(--text-muted);
            line-height: 1.6;
        }

        .note strong {
            color: var(--blue);
        }

        .footer {
            text-align: center;
            margin-top: 2rem;
            font-size: 0.8rem;
            color: var(--text-muted);
            opacity: 0.7;
        }

        @media (max-width: 480px) {
            .card { padding: 1.5rem; }
            .logo { font-size: 2rem; }
            .result-highlight .value { font-size: 2rem; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="logo">DDTank</div>
            <p class="subtitle">Calculadora de Tiro com Ângulo Full</p>
        </div>

        <div class="card">
            <div class="field">
                <label for="distancia">Distância (0 - 20)</label>
                <input type="number" id="distancia" placeholder="Ex: 10" min="0" max="20" step="0.5">
            </div>

            <div class="field">
                <label for="vento">Vento (0.0 - 5.0)</label>
                <input type="number" id="vento" placeholder="Ex: 1.5" min="0" max="5" step="0.1">
            </div>

            <div class="field">
                <label for="direcao">Direção do Vento</label>
                <select id="direcao">
                    <option value="contra">Contra (←)</option>
                    <option value="favor">A Favor (→)</option>
                </select>
            </div>

            <button class="calculate" onclick="calcular()">Calcular Tiro</button>

            <div class="result" id="resultado">
                <div class="result-row">
                    <span class="label">Distância</span>
                    <span class="value" id="rDistancia">0</span>
                </div>
                <div class="result-row">
                    <span class="label">Vento</span>
                    <span class="value" id="rVento">0.0</span>
                </div>
                <div class="result-highlight">
                    <div class="label">Ângulo Ideal</div>
                    <div class="value" id="rAngulo">90°</div>
                </div>
                <div class="result-highlight" style="margin-top: 0.75rem;">
                    <div class="label">Força (Pressão)</div>
                    <div class="value" id="rForca">95</div>
                </div>

                <div class="note">
                    <strong>Fórmula (Ângulo Full):</strong> 90 - Distância ± (Vento × 2). <br>
                    Vento a favor: some. Vento contra: subtraia. <br>
                    Força padrão: <strong>95</strong>.
                </div>
            </div>
        </div>

        <div class="footer">
            DDTank · Calculadora de Ângulo Full · Baseado nas tabelas clássicas do jogo
        </div>
    </div>

    <script>
        function calcular() {
            const distancia = parseFloat(document.getElementById('distancia').value);
            const vento = parseFloat(document.getElementById('vento').value);
            const direcao = document.getElementById('direcao').value;

            if (isNaN(distancia) || distancia < 0 || distancia > 20) {
                alert('Informe uma distância válida entre 0 e 20.');
                return;
            }

            if (isNaN(vento) || vento < 0 || vento > 5) {
                alert('Informe um vento válido entre 0.0 e 5.0.');
                return;
            }

            // Fórmula Ângulo Full: 90 - Distância ± (Vento × 2)
            let ajusteVento = vento * 2;
            let angulo;

            if (direcao === 'favor') {
                angulo = 90 - distancia + ajusteVento;
            } else {
                angulo = 90 - distancia - ajusteVento;
            }

            // Arredondar para inteiro mais próximo (jogo usa ângulos inteiros)
            angulo = Math.round(angulo);

            // Limitar entre 0 e 90 (ou 120 para ângulos altos)
            if (angulo < 0) angulo = 0;
            if (angulo > 120) angulo = 120;

            // Exibir resultados
            document.getElementById('rDistancia').textContent = distancia;
            document.getElementById('rVento').textContent = vento.toFixed(1) + (direcao === 'favor' ? ' →' : ' ←');
            document.getElementById('rAngulo').textContent = angulo + '°';
            document.getElementById('rForca').textContent = '95';

            document.getElementById('resultado').classList.add('active');
        }
    </script>
</body>
</html>

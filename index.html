<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="title">DDTank · Calculadora de Tiro</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0f0620;
            --bg-alt: #1a0b2e;
            --surface: #241542;
            --surface-hover: #2f1c54;
            --border: #3d2a63;
            --border-light: #4a3a6a;
            --text: #f5edff;
            --text-muted: #b8a8d9;
            --text-dim: #7a6b99;
            --accent: #ff6b9d;
            --accent-hover: #ff4d7d;
            --accent-glow: rgba(255, 107, 157, 0.35);
            --yellow: #ffd93d;
            --yellow-glow: rgba(255, 217, 61, 0.4);
            --blue: #4dabf7;
            --blue-glow: rgba(77, 171, 247, 0.3);
            --green: #51cf66;
            --purple: #9775fa;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: var(--bg);
            background-image:
                radial-gradient(circle at 20% 20%, rgba(151, 117, 250, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(255, 107, 157, 0.12) 0%, transparent 50%),
                radial-gradient(circle at 50% 50%, rgba(77, 171, 247, 0.08) 0%, transparent 60%);
            background-attachment: fixed;
            color: var(--text);
            font-family: 'Fredoka', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 1rem;
            -webkit-font-smoothing: antialiased;
        }

        .lang-switch {
            position: fixed;
            top: 1.5rem;
            right: 1.5rem;
            display: flex;
            gap: 0.4rem;
            z-index: 100;
            background: var(--surface);
            border: 2px solid var(--border);
            border-radius: 12px;
            padding: 0.3rem;
        }

        .lang-switch button {
            background: transparent;
            border: none;
            color: var(--text-muted);
            padding: 0.4rem 0.9rem;
            border-radius: 8px;
            font-size: 0.8rem;
            font-weight: 600;
            font-family: 'Fredoka', sans-serif;
            cursor: pointer;
            transition: all 0.2s ease;
            letter-spacing: 0.05em;
        }

        .lang-switch button.active {
            background: linear-gradient(135deg, var(--accent), var(--purple));
            color: #fff;
            box-shadow: 0 4px 12px var(--accent-glow);
        }

        .lang-switch button:hover:not(.active) {
            color: var(--text);
            background: var(--surface-hover);
        }

        .container {
            width: 100%;
            max-width: 560px;
        }

        .header {
            text-align: center;
            margin-bottom: 2.5rem;
        }

        .logo {
            font-size: 3rem;
            font-weight: 700;
            letter-spacing: -0.03em;
            margin-bottom: 0.5rem;
            background: linear-gradient(135deg, var(--yellow) 0%, var(--accent) 50%, var(--purple) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            filter: drop-shadow(0 0 25px var(--accent-glow));
            line-height: 1;
        }

        .subtitle {
            color: var(--text-muted);
            font-size: 1rem;
            font-weight: 400;
            letter-spacing: 0.02em;
        }

        .card {
            background: var(--surface);
            border: 2px solid var(--border);
            border-radius: 28px;
            padding: 2.5rem;
            box-shadow:
                0 30px 80px rgba(0, 0, 0, 0.6),
                inset 0 1px 0 rgba(255, 255, 255, 0.06),
                0 0 0 1px rgba(255, 107, 157, 0.08);
            position: relative;
            overflow: hidden;
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, var(--yellow), var(--accent), var(--purple), var(--blue));
        }

        .field {
            margin-bottom: 1.75rem;
        }

        .field:last-of-type {
            margin-bottom: 2rem;
        }

        label {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.9rem;
            font-weight: 500;
            color: var(--text-muted);
            margin-bottom: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }

        label::before {
            content: '▸';
            color: var(--accent);
            font-size: 0.9rem;
        }

        input, select {
            width: 100%;
            background: var(--bg-alt);
            border: 2px solid var(--border);
            border-radius: 16px;
            padding: 1.1rem 1.3rem;
            color: var(--text);
            font-size: 1.15rem;
            font-family: 'JetBrains Mono', monospace;
            font-weight: 700;
            transition: all 0.2s ease;
            outline: none;
        }

        input:focus, select:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 4px var(--accent-glow);
            background: var(--bg);
        }

        input::placeholder {
            color: var(--text-dim);
            font-weight: 400;
        }

        select {
            cursor: pointer;
            font-family: 'Fredoka', sans-serif;
            font-weight: 500;
        }

        select option {
            background: var(--surface);
            color: var(--text);
        }

        button.calculate {
            width: 100%;
            background: linear-gradient(135deg, var(--accent), var(--purple));
            color: #fff;
            border: none;
            border-radius: 16px;
            padding: 1.2rem;
            font-size: 1.15rem;
            font-weight: 600;
            font-family: 'Fredoka', sans-serif;
            cursor: pointer;
            transition: transform 0.15s ease, box-shadow 0.2s ease;
            box-shadow:
                0 10px 30px var(--accent-glow),
                inset 0 1px 0 rgba(255, 255, 255, 0.2);
            margin-top: 0.5rem;
            letter-spacing: 0.02em;
        }

        button.calculate:hover {
            transform: translateY(-2px);
            box-shadow:
                0 15px 40px var(--accent-glow),
                inset 0 1px 0 rgba(255, 255, 255, 0.2);
        }

        button.calculate:active {
            transform: translateY(0) scale(0.98);
        }

        .result {
            margin-top: 2rem;
            padding-top: 2rem;
            border-top: 2px dashed var(--border-light);
            display: none;
        }

        .result.active {
            display: block;
            animation: popIn 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        @keyframes popIn {
            from { opacity: 0; transform: scale(0.92) translateY(12px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }

        .result-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.9rem 0;
            font-size: 0.95rem;
            border-bottom: 1px solid rgba(74, 58, 106, 0.4);
        }

        .result-row:last-of-type {
            border-bottom: none;
        }

        .result-row .label {
            color: var(--text-muted);
            font-weight: 400;
        }

        .result-row .value {
            font-weight: 700;
            font-family: 'JetBrains Mono', monospace;
            color: var(--text);
        }

        .result-highlight {
            background: linear-gradient(135deg, rgba(255, 107, 157, 0.12), rgba(151, 117, 250, 0.1));
            border: 2px solid var(--accent);
            border-radius: 20px;
            padding: 1.75rem;
            margin-top: 1rem;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .result-highlight::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, transparent, var(--accent), transparent);
        }

        .result-highlight .label {
            font-size: 0.8rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.15em;
            margin-bottom: 0.6rem;
            font-weight: 500;
        }

        .result-highlight .value {
            font-size: 2.75rem;
            font-weight: 700;
            font-family: 'JetBrains Mono', monospace;
            color: var(--yellow);
            text-shadow: 0 0 30px var(--yellow-glow);
            line-height: 1;
        }

        .result-highlight.force {
            background: linear-gradient(135deg, rgba(77, 171, 247, 0.12), rgba(151, 117, 250, 0.1));
            border-color: var(--blue);
        }

        .result-highlight.force::before {
            background: linear-gradient(90deg, transparent, var(--blue), transparent);
        }

        .result-highlight.force .value {
            color: var(--blue);
            text-shadow: 0 0 30px var(--blue-glow);
        }

        .wind-badge {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            background: var(--bg-alt);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 0.3rem 0.8rem;
            font-size: 0.85rem;
            font-family: 'JetBrains Mono', monospace;
            font-weight: 700;
        }

        .note {
            margin-top: 1.5rem;
            padding: 1.1rem 1.3rem;
            background: rgba(77, 171, 247, 0.06);
            border: 1px solid rgba(77, 171, 247, 0.2);
            border-radius: 14px;
            font-size: 0.82rem;
            color: var(--text-muted);
            line-height: 1.7;
        }

        .note strong {
            color: var(--blue);
            font-weight: 600;
        }

        .note code {
            font-family: 'JetBrains Mono', monospace;
            background: var(--bg-alt);
            padding: 0.15rem 0.4rem;
            border-radius: 5px;
            color: var(--yellow);
            font-size: 0.78rem;
        }

        .footer {
            text-align: center;
            margin-top: 2.5rem;
            font-size: 0.8rem;
            color: var(--text-dim);
            line-height: 1.6;
        }

        .footer a {
            color: var(--accent);
            text-decoration: none;
            transition: color 0.2s ease;
        }

        .footer a:hover {
            color: var(--accent-hover);
        }

        @media (max-width: 520px) {
            .card { padding: 1.75rem; border-radius: 22px; }
            .logo { font-size: 2.25rem; }
            .result-highlight .value { font-size: 2.25rem; }
            .lang-switch { top: 1rem; right: 1rem; }
            .lang-switch button { padding: 0.35rem 0.7rem; font-size: 0.75rem; }
            label { font-size: 0.8rem; }
            input, select { font-size: 1rem; padding: 1rem 1.1rem; }
            button.calculate { font-size: 1rem; padding: 1.1rem; }
        }
    </style>
</head>
<body>

    <div class="lang-switch">
        <button data-lang="pt-BR" class="active">PT</button>
        <button data-lang="en">EN</button>
    </div>

    <div class="container">
        <div class="header">
            <div class="logo">DDTank</div>
            <p class="subtitle" data-i18n="subtitle">Calculadora de Tiro com Ângulo Full</p>
        </div>

        <div class="card">
            <div class="field">
                <label for="distancia" data-i18n="labelDistance">Distância (0 - 20)</label>
                <input type="number" id="distancia" placeholder="Ex: 10" min="0" max="20" step="0.5" data-i18n-placeholder="placeholderDistance">
            </div>

            <div class="field">
                <label for="vento" data-i18n="labelWind">Vento (0.0 - 5.0)</label>
                <input type="number" id="vento" placeholder="Ex: 1.5" min="0" max="5" step="0.1" data-i18n-placeholder="placeholderWind">
            </div>

            <div class="field">
                <label for="direcao" data-i18n="labelDirection">Direção do Vento</label>
                <select id="direcao">
                    <option value="contra" data-i18n="optionAgainst">Contra (←)</option>
                    <option value="favor" data-i18n="optionInFavor">A Favor (→)</option>
                </select>
            </div>

            <button class="calculate" onclick="calcular()" data-i18n="buttonCalculate">Calcular Tiro</button>

            <div class="result" id="resultado">
                <div class="result-row">
                    <span class="label" data-i18n="labelResultDistance">Distância</span>
                    <span class="value" id="rDistancia">0</span>
                </div>
                <div class="result-row">
                    <span class="label" data-i18n="labelResultWind">Vento</span>
                    <span class="value">
                        <span class="wind-badge" id="rVento">0.0 →</span>
                    </span>
                </div>
                <div class="result-highlight">
                    <div class="label" data-i18n="labelAngle">Ângulo Ideal</div>
                    <div class="value" id="rAngulo">90°</div>
                </div>
                <div class="result-highlight force">
                    <div class="label" data-i18n="labelForce">Força (Pressão)</div>
                    <div class="value" id="rForca">95</div>
                </div>

                <div class="note">
                    <strong data-i18n="noteTitle">Fórmula (Ângulo Full):</strong>
                    <span data-i18n="noteFormula">90 - Distância ± (Vento × 2).</span><br>
                    <span data-i18n="noteWind">Vento a favor: some. Vento contra: subtraia.</span><br>
                    <span data-i18n="noteForce">Força padrão:</span> <code>95</code>.
                </div>
            </div>
        </div>

        <div class="footer">
            DDTank · <span data-i18n="footer">Calculadora de Ângulo Full · Baseado nas tabelas clássicas do jogo</span>
        </div>
    </div>

    <script>
        const translations = {
            'pt-BR': {
                title: 'DDTank · Calculadora de Tiro',
                subtitle: 'Calculadora de Tiro com Ângulo Full',
                labelDistance: 'Distância (0 - 20)',
                placeholderDistance: 'Ex: 10',
                labelWind: 'Vento (0.0 - 5.0)',
                placeholderWind: 'Ex: 1.5',
                labelDirection: 'Direção do Vento',
                optionAgainst: 'Contra (←)',
                optionInFavor: 'A Favor (→)',
                buttonCalculate: 'Calcular Tiro',
                labelResultDistance: 'Distância',
                labelResultWind: 'Vento',
                labelAngle: 'Ângulo Ideal',
                labelForce: 'Força (Pressão)',
                noteTitle: 'Fórmula (Ângulo Full):',
                noteFormula: '90 - Distância ± (Vento × 2).',
                noteWind: 'Vento a favor: some. Vento contra: subtraia.',
                noteForce: 'Força padrão:',
                footer: 'Calculadora de Ângulo Full · Baseado nas tabelas clássicas do jogo',
                alertDistance: 'Informe uma distância válida entre 0 e 20.',
                alertWind: 'Informe um vento válido entre 0.0 e 5.0.'
            },
            'en': {
                title: 'DDTank · Shot Calculator',
                subtitle: 'Full Angle Shot Calculator',
                labelDistance: 'Distance (0 - 20)',
                placeholderDistance: 'Ex: 10',
                labelWind: 'Wind (0.0 - 5.0)',
                placeholderWind: 'Ex: 1.5',
                labelDirection: 'Wind Direction',
                optionAgainst: 'Against (←)',
                optionInFavor: 'In Favor (→)',
                buttonCalculate: 'Calculate Shot',
                labelResultDistance: 'Distance',
                labelResultWind: 'Wind',
                labelAngle: 'Ideal Angle',
                labelForce: 'Force (Power)',
                noteTitle: 'Formula (Full Angle):',
                noteFormula: '90 - Distance ± (Wind × 2).',
                noteWind: 'Wind in favor: add. Wind against: subtract.',
                noteForce: 'Default force:',
                footer: 'Full Angle Calculator · Based on classic game tables',
                alertDistance: 'Please enter a valid distance between 0 and 20.',
                alertWind: 'Please enter a valid wind between 0.0 and 5.0.'
            }
        };

        let currentLang = 'pt-BR';

        function detectLanguage() {
            const browserLang = navigator.language || navigator.userLanguage;
            if (browserLang.toLowerCase().startsWith('pt')) {
                return 'pt-BR';
            }
            return 'en';
        }

        function applyTranslations(lang) {
            currentLang = lang;
            const t = translations[lang];

            document.documentElement.lang = lang;
            document.title = t.title;

            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (t[key]) {
                    el.textContent = t[key];
                }
            });

            document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
                const key = el.getAttribute('data-i18n-placeholder');
                if (t[key]) {
                    el.placeholder = t[key];
                }
            });

            document.querySelectorAll('.lang-switch button').forEach(btn => {
                btn.classList.toggle('active', btn.getAttribute('data-lang') === lang);
            });
        }

        function calcular() {
            const t = translations[currentLang];
            const distancia = parseFloat(document.getElementById('distancia').value);
            const vento = parseFloat(document.getElementById('vento').value);
            const direcao = document.getElementById('direcao').value;

            if (isNaN(distancia) || distancia < 0 || distancia > 20) {
                alert(t.alertDistance);
                return;
            }

            if (isNaN(vento) || vento < 0 || vento > 5) {
                alert(t.alertWind);
                return;
            }

            let ajusteVento = vento * 2;
            let angulo;

            if (direcao === 'favor') {
                angulo = 90 - distancia + ajusteVento;
            } else {
                angulo = 90 - distancia - ajusteVento;
            }

            angulo = Math.round(angulo);

            if (angulo < 0) angulo = 0;
            if (angulo > 120) angulo = 120;

            document.getElementById('rDistancia').textContent = distancia;
            document.getElementById('rVento').textContent = vento.toFixed(1) + (direcao === 'favor' ? ' →' : ' ←');
            document.getElementById('rAngulo').textContent = angulo + '°';
            document.getElementById('rForca').textContent = '95';

            document.getElementById('resultado').classList.add('active');
        }

        document.querySelectorAll('.lang-switch button').forEach(btn => {
            btn.addEventListener('click', () => {
                applyTranslations(btn.getAttribute('data-lang'));
            });
        });

        applyTranslations(detectLanguage());
    </script>
</body>
</html>
